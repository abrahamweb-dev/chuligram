<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search - Chuligram</title>

    <link
        rel="stylesheet"
        href="../Style.css"
    >
</head>

<body>

<div class="app">

    <header class="topbar">

        <button
            class="back-button"
            onclick="goBack()"
        >
            ←
        </button>

        <h2>Search</h2>

        <div></div>

    </header>

    <main class="page-content">

        <input
            id="globalSearch"
            class="search-input"
            type="text"
            placeholder="Search Chuligram..."
            oninput="globalSearch()"
        >

        <div id="searchResults"></div>

    </main>

</div>

<script src="../App.js"></script>

<script>
requireLogin();
</script>

</body>
</html>

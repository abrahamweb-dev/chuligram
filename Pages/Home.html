<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#229ed9"
    >

    <title>Chuligram - Chats</title>

    <link
        rel="stylesheet"
        href="../Style.css"
    >
</head>

<body>

<div class="app">

    <header class="topbar">

        <div>
            <h2>Chuligram</h2>
            <small id="connectionStatus">Connecting…</small>
        </div>

        <div style="display:flex; gap:6px;">

            <button
                class="icon-button"
                onclick="goTo('Search.html')"
            >
                🔍
            </button>

            <button
                class="icon-button"
                onclick="goTo('Contacts.html')"
            >
                ✏️
            </button>

        </div>

    </header>

    <main class="page-content">

        <div id="chatList"></div>

    </main>

    <nav class="bottom-nav">

        <button class="active">
            <span>💬</span>
            Chats
        </button>

        <button onclick="goTo('Contacts.html')">
            <span>👥</span>
            Contacts
        </button>

        <button onclick="goTo('Settings.html')">
            <span>⚙️</span>
            Settings
        </button>

    </nav>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script src="../Data/Users.js"></script>
<script src="../Data/Groups.js"></script>
<script src="../Data/Channels.js"></script>
<script src="../Data/Bots.js"></script>
<script src="../App.js"></script>

<script>
requireLogin();
loadChatList();
connectSocket();
</script>

</body>
</html>

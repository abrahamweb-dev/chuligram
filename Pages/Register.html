<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#229ed9">
    <title>Chuligram - Sign Up</title>
    <link rel="stylesheet" href="../Style.css">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <img src="../Logo-avatar.png" class="login-logo" alt="Chuligram">

        <h1>Chuligram</h1>

        <p class="subtitle">Create your account</p>

        <form onsubmit="register(event)">

            <input
                id="regName"
                type="text"
                placeholder="Your name"
                autocomplete="name"
                required
            >

            <input
                id="regUsername"
                type="text"
                placeholder="Choose a username"
                autocomplete="username"
                required
            >

            <input
                id="regPassword"
                type="password"
                placeholder="Choose a password"
                autocomplete="new-password"
                required
                minlength="4"
            >

            <button class="primary-button" type="submit">
                Create Account
            </button>

        </form>

        <p id="regMessage" class="error-message"></p>

        <div class="test-login">
            <span>Already have an account?</span>
            <a href="../Index.html" style="color:#229ed9;">Log in</a>
        </div>

    </div>

</div>

<script src="../App.js"></script>

</body>
</html>

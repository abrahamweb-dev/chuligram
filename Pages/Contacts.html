<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contacts - Chuligram</title>

    <link
        rel="stylesheet"
        href="../Style.css"
    >
</head>

<body>

<div class="app">

    <header class="topbar">

        <button
            class="back-button"
            onclick="goTo('Home.html')"
        >
            ←
        </button>

        <h2>Contacts</h2>

        <button
            class="icon-button"
            onclick="goTo('Search.html')"
        >
            🔍
        </button>

    </header>

    <main class="page-content">

        <input
            id="contactSearch"
            class="search-input"
            type="text"
            placeholder="Search contacts..."
            oninput="filterContacts()"
        >

        <div id="contactsList"></div>

    </main>

    <nav class="bottom-nav">

        <button onclick="goTo('Home.html')">
            <span>💬</span>
            Chats
        </button>

        <button class="active">
            <span>👥</span>
            Contacts
        </button>

        <button onclick="goTo('Settings.html')">
            <span>⚙️</span>
            Settings
        </button>

    </nav>

</div>

<script src="../App.js"></script>

<script>
requireLogin();
loadContacts();
</script>

</body>
</html>
